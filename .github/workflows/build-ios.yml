name: build-ios (STS2 → iPhone 瘦身未签 IPA)
# 从私有 Release(game-files)拉游戏 dll，编译 spine iOS 库，跑 build-ios.sh 命令行六步
# (STS2_SKIP_PCK=1 跳过 pck 三连——StS2.pck 已在本地做好并单独上机)，
# xcodebuild 无签名编译 → 剥壳 pck → 注入 --main-pack → ad-hoc 伪签(带大内存 entitlements) → 瘦身 IPA。
# SideStore 用用户自己的 Apple ID 对 IPA 重签并保留 increased-memory entitlement。

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "App bundle id（自定，建议反向域名）"
        required: true
        default: "com.flipflopszzz.sts2"

permissions:
  contents: read

env:
  GODOT_VER: "4.5.1-stable"
  FMOD_RELEASE: "6.1.0-4.5.0"

jobs:
  build-spine-ios:
    name: 编译 spine-godot iOS framework
    runs-on: macos-26
    steps:
      - name: Checkout spine-runtimes 4.2
        run: git clone --depth 1 -b 4.2 https://github.com/EsotericSoftware/spine-runtimes.git
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scons
        run: pip install scons
      - name: Build spine ios (编完立即收走,防 macos 构建清 bin)
        run: |
          cd spine-runtimes/spine-godot/build
          ./setup-extension.sh 4.5.1-stable false
          ./build-extension.sh ios
          FW=$(find .. -type d -name "libspine_godot.ios.template_release.framework" | head -1)
          [ -n "$FW" ] || { echo "ios framework 未产出"; exit 1; }
          mkdir -p "$RUNNER_TEMP/spinepack/ios"
          cp -R "$FW" "$RUNNER_TEMP/spinepack/ios/"
      - name: Build spine macos (编辑器校验用)
        run: |
          cd spine-runtimes/spine-godot/build
          ./build-extension.sh macos
          ED=$(find .. -type d -name "libspine_godot.macos.editor.framework" | head -1)
          [ -n "$ED" ] || { echo "macos framework 未产出"; exit 1; }
          mkdir -p "$RUNNER_TEMP/spinepack/macos"
          cp -R "$(dirname "$ED")"/libspine_godot.macos.*.framework "$RUNNER_TEMP/spinepack/macos/"
      - name: Pack frameworks
        run: |
          ls -R "$RUNNER_TEMP/spinepack"
          cd "$RUNNER_TEMP/spinepack" && zip -qry "$GITHUB_WORKSPACE/spine-libs.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: spine-ios
          path: spine-libs.zip
          retention-days: 1

  build-app:
    name: 织入 + AOT + Godot 导出 + 瘦身 IPA
    runs-on: macos-26
    needs: build-spine-ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: /Users/runner/dotnet9   # 独立目录: 镜像预装的 .NET 10 会让 Godot 编辑器内 C# 构建崩(Abort trap 6 / Failed to load project assembly)
        with:
          dotnet-version: 9.0.x

      - name: Install .NET iOS workload (NativeAOT ios-arm64)
        run: |
          dotnet --version   # 必须 9.0.x
          dotnet workload install ios

      - name: Download Godot 4.5.1 mono + iOS 导出模板
        run: |
          cd "$RUNNER_TEMP"
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_mono_macos.universal.zip"
          curl -fL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_mono_export_templates.tpz"
          unzip -q godot.zip -d "$HOME/godot"
          xattr -dr com.apple.quarantine "$HOME/godot" 2>/dev/null || true
          "$HOME/godot/Godot_mono.app/Contents/MacOS/Godot" --version
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates"
          unzip -q templates.tpz -d gt
          mv gt/templates "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VER/-/.}.mono"

      - uses: actions/download-artifact@v4
        with:
          name: spine-ios
          path: spine-art

      - name: 取游戏 dll（私有数据仓 Release）+ FMOD 官方 iOS 库
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          gh release download game-files --repo FlipFlopszzz/sts2-ios-data -p data-windows.zip -D "$RUNNER_TEMP"
          RES="$HOME/game/Slay the Spire 2/SlayTheSpire2.app/Contents/Resources"
          mkdir -p "$RES"
          cd "$RES" && unzip -q "$RUNNER_TEMP/data-windows.zip"
          mv data_sts2_windows_x86_64 data_sts2_macos_arm64
          curl -fL -o "$RUNNER_TEMP/fmod-addons.zip" \
            "https://github.com/utopia-rise/fmod-gdextension/releases/download/${FMOD_RELEASE}/addons.zip"
          unzip -q "$RUNNER_TEMP/fmod-addons.zip" -d "$RUNNER_TEMP/fmodaddons"

      - name: 摆第三方库（iOS 构建 + macOS 编辑器校验用）
        run: |
          mkdir -p "$HOME/ios-libs" "$HOME/fmod-ios/lib"
          unzip -q spine-art/spine-libs.zip -d "$HOME/spine-libs"
          IOS_FW=$(find "$HOME/spine-libs" -type d -name "libspine_godot.ios.template_release.framework" | head -1)
          MACOS_ED=$(find "$HOME/spine-libs" -type d -name "libspine_godot.macos.editor.framework" | head -1)
          [ -n "$IOS_FW" ] && [ -n "$MACOS_ED" ] || { echo "spine framework 不全"; exit 1; }
          cp -R "$IOS_FW" "$HOME/ios-libs/"
          # Godot 4.5 导出校验: 编辑器平台(macos)必须能加载扩展库,否则拒导出
          mkdir -p ios-export/addons/spine/macos ios-export/addons/fmod/libs/macos
          MAC_DIR=$(dirname "$MACOS_ED")
          cp -R "$MAC_DIR"/libspine_godot.macos.*.framework ios-export/addons/spine/macos/
          cp -R "$RUNNER_TEMP/fmodaddons/fmod/libs/macos/." ios-export/addons/fmod/libs/macos/
          cp -R "$RUNNER_TEMP/fmodaddons/fmod/libs/iOS/libGodotFmod.ios.template_release.xcframework" "$HOME/ios-libs/"
          cp "$RUNNER_TEMP/fmodaddons/fmod/libs/iOS/libfmod_iphoneos.a" \
             "$RUNNER_TEMP/fmodaddons/fmod/libs/iOS/libfmodstudio_iphoneos.a" "$HOME/fmod-ios/lib/"

      - name: 准备 game-refs（补丁库编译引用，仓库不含）
        run: |
          RES="$HOME/game/Slay the Spire 2/SlayTheSpire2.app/Contents/Resources/data_sts2_macos_arm64"
          mkdir -p game-refs
          cp "$RES/sts2.dll" "$RES/GodotSharp.dll" game-refs/

      - name: 生成 config.sh + .gdextension 入口（仓库不含，见 .gitignore）
        run: |
          TEAM_PLACE="TEAMPLACE00"   # 占位 Team ID；SideStore 重签时替换为真实值
          # preset 的 app_store_team_id 是 required 项,为空 Godot 拒绝导出——填占位
          sed -i '' "s|application/app_store_team_id=\"\"|application/app_store_team_id=\"$TEAM_PLACE\"|" ios-export/export_presets.cfg
          cat > ios-export/config.sh <<CFG
          STS2_TEAM_ID="$TEAM_PLACE"
          STS2_BUNDLE_ID="${{ inputs.bundle_id }}"
          STS2_SIGN_IDENTITY="-"
          STS2_DEVICE_UDID=""
          STS2_BUNDLE_ID_SIGNED="\$STS2_BUNDLE_ID"
          STS2_GAME_APP="$HOME/game/Slay the Spire 2/SlayTheSpire2.app/Contents/Resources"
          STS2_GODOT_BIN="$HOME/godot/Godot_mono.app/Contents/MacOS/Godot"
          STS2_DOTNET_ROOT="${DOTNET_ROOT:-$HOME/.dotnet}"
          STS2_IOS_LIBS_DIR="$HOME/ios-libs"
          STS2_FMOD_STATIC_DIR="$HOME/fmod-ios/lib"
          CFG
          mkdir -p ios-export/addons/spine ios-export/addons/fmod
          curl -fL -o ios-export/addons/spine/spine_godot_extension.gdextension \
            "https://raw.githubusercontent.com/EsotericSoftware/spine-runtimes/4.2/spine-godot/spine_godot_extension.gdextension"
          cp "$RUNNER_TEMP/fmodaddons/fmod/fmod.gdextension" ios-export/addons/fmod/fmod.gdextension

      - name: build-ios.sh（织入 → 依赖组装 → AOT → Godot 导出 → FMOD 注入 → entitlements）
        env:
          STS2_SKIP_PCK: "1"
        run: bash ios-export/build-ios.sh

      - name: xcodebuild 无签名编译 → 剥壳 → 注入 cmdline → 伪签 → 瘦身 IPA
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          PBX=ios-export/build/StS2.xcodeproj/project.pbxproj
          mkdir -p ios-export/build/fmodlibs ios-export/build/gdextlibs
          cp ios-export/addons/fmod/libs/iOS/libfmod_iphoneos.a ios-export/addons/fmod/libs/iOS/libfmodstudio_iphoneos.a ios-export/build/fmodlibs/
          cp -R ios-export/addons/spine/ios/libspine_godot.ios.template_release.framework ios-export/build/gdextlibs/
          cp -R ios-export/addons/fmod/libs/iOS/libGodotFmod.ios.template_release.xcframework ios-export/build/gdextlibs/
          python3 tools/fix_pbx_gdext.py "$PBX"
          xcodebuild -project ios-export/build/StS2.xcodeproj -scheme StS2 -configuration Release -sdk iphoneos -derivedDataPath ios-export/build/dd CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -quiet || { echo "=== 修复后仍失败,pbxproj 头部 ==="; head -10 "$PBX"; echo "=== export.log 尾部 ==="; tail -40 ios-export/.work/export.log; exit 1; }
          APP="ios-export/build/dd/Build/Products/Release-iphoneos/StS2.app"
          [ -d "$APP" ] || { echo "未产出 .app"; exit 1; }
          rm -f "$APP"/*.pck
          mkdir -p "$APP/Frameworks"
          cp -R ios-export/build/gdextlibs/libGodotFmod.ios.template_release.xcframework/ios-arm64/*.dylib "$APP/Frameworks/" 2>/dev/null || true
          [ -d "$APP/Frameworks/libspine_godot.ios.template_release.framework" ] || cp -R ios-export/build/gdextlibs/libspine_godot.ios.template_release.framework "$APP/Frameworks/"
          echo "=== App Frameworks 内容 ==="; ls -la "$APP/Frameworks/"
          DYLIB="$APP/Frameworks/libGodotFmod.ios.template_release.universal.dylib"
          SPINE_DIR="$APP/Frameworks/libspine_godot.ios.template_release.framework"
          echo "--- 修前 otool -D dylib ---"; otool -D "$DYLIB" || true
          echo "--- 修前 otool -L StS2 ---"; otool -L "$APP/StS2" | head -15
          install_name_tool -id "@rpath/libGodotFmod.ios.template_release.universal.dylib" "$DYLIB" || true
          install_name_tool -change "libGodotFmod.ios.template_release.universal.dylib" "@rpath/libGodotFmod.ios.template_release.universal.dylib" "$APP/StS2" || true
          if [ -d "$SPINE_DIR" ]; then
            SPINE_BIN=$(ls "$SPINE_DIR"/libspine_godot.ios.template_release 2>/dev/null | head -1)
            if [ -n "$SPINE_BIN" ]; then
              echo "--- spine install name ---"; otool -D "$SPINE_BIN" || true
              SPINE_OLD=$(otool -D "$SPINE_BIN" 2>/dev/null | tail -1)
              install_name_tool -id "@rpath/libspine_godot.ios.template_release.framework/libspine_godot.ios.template_release" "$SPINE_BIN" || true
              if [ -n "$SPINE_OLD" ] && [ "$SPINE_OLD" != "@rpath/libspine_godot.ios.template_release.framework/libspine_godot.ios.template_release" ]; then
                install_name_tool -change "$SPINE_OLD" "@rpath/libspine_godot.ios.template_release.framework/libspine_godot.ios.template_release" "$APP/StS2" 2>/dev/null || true
              fi
            fi
          fi
          echo "--- 修后 otool -L StS2 ---"; otool -L "$APP/StS2" | head -15
          plutil -remove godot_cmdline "$APP/Info.plist" 2>/dev/null || true
          plutil -insert godot_cmdline -json '["--main-pack", "user://StS2.pck"]' "$APP/Info.plist"
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" "$APP/Info.plist"
          plutil -replace CFBundleShortVersionString -string "0.111.0" "$APP/Info.plist"
          for fw in "$APP/Frameworks/"*.framework; do
            codesign -f -s - --generate-entitlement-der "$fw"
          done
          for dy in "$APP/Frameworks/"*.dylib; do
            [ -e "$dy" ] && codesign -f -s - --generate-entitlement-der "$dy"
          done
          codesign -f -s - --generate-entitlement-der --entitlements ios-export/.work/ent_mem.plist "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q increased-memory \
            || { echo "大内存 entitlement 缺失"; exit 1; }
          du -sh "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qry StS2-slim.ipa Payload
          du -h StS2-slim.ipa

      - name: 推 IPA 到私有数据仓 Release(public 仓库 artifact 人人可下,含游戏代码的 IPA 不能放这)
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          gh release view latest --repo FlipFlopszzz/sts2-ios-data >/dev/null 2>&1 \
            || gh release create latest --repo FlipFlopszzz/sts2-ios-data --title "IPA builds" --notes "最新瘦身 IPA"
          gh release upload latest StS2-slim.ipa --repo FlipFlopszzz/sts2-ios-data --clobber
          echo "IPA 已就位: FlipFlopszzz/sts2-ios-data releases tag latest"
